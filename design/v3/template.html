<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glance · 面板高保真原型 v1</title>
<style>
/* ═══════════════════════════════════════════════════════════
   Glance 面板 v1 · token 层(与 design/v3/tokens-v1.md 一一对应)
   浅色值在 :root,深色值在 [data-theme="dark"]
   ═══════════════════════════════════════════════════════════ */
:root {
  /* —— 唯一彩色:系统聚焦蓝 + 红绿灯 —— */
  --accent: #007AFF;
  --tl-r: #FF5F57; --tl-y: #FEBC2E; --tl-g: #28C840;

  /* —— 文字 —— */
  --label: rgba(0,0,0,.82);
  --label-2nd: rgba(0,0,0,.45);

  /* —— 玻璃 —— */
  --glass-tint: rgba(248,249,251,.46);
  --glass-sheen: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,0) 42%);
  --glass-blur: 30px;
  --glass-sat: 1.9;
  --edge-hi: rgba(255,255,255,.55);      /* 顶部 0.5px 受光 */
  --edge-ring: rgba(0,0,0,.08);          /* 外缘 0.5px 轮廓 */

  /* —— 阴影(偏移/模糊/透明度)—— */
  --shadow-strip: 0 24px 70px rgba(0,0,0,.20), 0 4px 16px rgba(0,0,0,.09);
  --shadow-pop:   0 30px 84px rgba(0,0,0,.24), 0 6px 18px rgba(0,0,0,.10);
  --icon-shadow:  drop-shadow(0 5px 12px rgba(0,0,0,.20)) drop-shadow(0 1px 2px rgba(0,0,0,.14));
  --icon-shadow-sel: drop-shadow(0 8px 16px rgba(0,0,0,.24)) drop-shadow(0 1.5px 3px rgba(0,0,0,.16));
  --card-shadow:  0 10px 24px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.10);
  --card-shadow-sel: 0 14px 32px rgba(0,0,0,.20), 0 3px 8px rgba(0,0,0,.12);

  /* —— 选中 —— */
  --plate: rgba(0,0,0,.055);             /* 图标选中托底 */
  --ko: rgba(252,252,253,.95);           /* 卡片聚焦环与截图之间的 knockout */
  --card-ring: rgba(0,0,0,.10);          /* 未选卡片 0.5px 发丝 */
  --label-name: rgba(0,0,0,.60);         /* App 名:标注,不是标题 */
  --tb-tint: rgba(246,247,248,.5);       /* 卡片标题栏带 */
  --tb-line: rgba(0,0,0,.06);            /* 标题栏下发丝 */

  /* —— 桌面布景(仅演示,不是产品 token)—— */
  --wall-1:#dfe5ee; --wall-2:#cdd7e6; --wall-3:#b8c5da;
  --bloom-1: rgba(168,190,224,.5);       /* 冷调光斑,给玻璃一点可透的颜色 */
  --bloom-2: rgba(226,214,196,.45);      /* 暖调光斑,防整屏死蓝 */

  /* —— 几何 —— */
  --r-panel: 22px; --r-cell: 19px; --r-card: 10px;
  --icon: 76px; --cell: 88px; --cell-gap: 8px;
  --card-h: 190px; --card-gap: 12px; --pop-pad: 12px; --pop-gap-y: 16px;
  --tb-h: 26px;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;

  /* —— 动效 —— */
  --ease-pop: cubic-bezier(.2,.8,.2,1);
  --ease-slide: cubic-bezier(.25,.8,.3,1);
}
[data-theme="dark"] {
  --accent: #0A84FF;
  --label: rgba(255,255,255,.86);
  --label-2nd: rgba(255,255,255,.45);
  --glass-tint: rgba(30,31,36,.55);
  --glass-sheen: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0) 42%);
  --edge-hi: rgba(255,255,255,.13);
  --edge-ring: rgba(255,255,255,.10);
  --shadow-strip: 0 24px 70px rgba(0,0,0,.55), 0 4px 16px rgba(0,0,0,.34);
  --shadow-pop:   0 30px 84px rgba(0,0,0,.60), 0 6px 18px rgba(0,0,0,.38);
  --icon-shadow:  drop-shadow(0 5px 12px rgba(0,0,0,.30)) drop-shadow(0 1px 2px rgba(0,0,0,.22));
  --icon-shadow-sel: drop-shadow(0 8px 16px rgba(0,0,0,.36)) drop-shadow(0 1.5px 3px rgba(0,0,0,.26));
  --card-shadow:  0 10px 24px rgba(0,0,0,.42), 0 2px 6px rgba(0,0,0,.30);
  --card-shadow-sel: 0 14px 32px rgba(0,0,0,.50), 0 3px 8px rgba(0,0,0,.34);
  --plate: rgba(255,255,255,.09);
  --ko: rgba(24,25,29,.95);
  --card-ring: rgba(255,255,255,.13);
  --label-name: rgba(255,255,255,.62);
  --tb-tint: rgba(38,39,44,.5);
  --tb-line: rgba(255,255,255,.08);
  --wall-1:#181c23; --wall-2:#12151c; --wall-3:#0b0e13;
  --bloom-1: rgba(46,64,96,.5);
  --bloom-2: rgba(58,48,52,.4);
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { min-height:100%; }
body {
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overflow: auto;
}

/* ══════════ 桌面布景(演示用,让玻璃有光可透)══════════ */
.wallpaper {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(90% 70% at 22% 18%, var(--bloom-1) 0%, transparent 62%),
    radial-gradient(80% 60% at 82% 78%, var(--bloom-2) 0%, transparent 58%),
    radial-gradient(120% 90% at 18% 8%, var(--wall-1) 0%, transparent 60%),
    radial-gradient(110% 90% at 85% 20%, var(--wall-2) 0%, transparent 55%),
    linear-gradient(168deg, var(--wall-1) 0%, var(--wall-2) 52%, var(--wall-3) 100%);
  transition: background .2s ease;
}

/* ══════════ 演示控制条(非产品)══════════ */
.controls {
  position: fixed; top: 16px; right: 16px; z-index: 30;
  display: flex; gap: 8px; font-size: 12px;
}
.seg {
  display: flex; padding: 3px; gap: 2px;
  border-radius: 9px;
  background: var(--glass-tint); background-image: var(--glass-sheen);
  -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
  box-shadow: 0 4px 14px rgba(0,0,0,.12), 0 0 0 .5px var(--edge-ring), inset 0 .5px 0 var(--edge-hi);
}
.seg button {
  font: 500 12px/1 var(--font); color: var(--label-2nd);
  border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; cursor: pointer;
}
.seg button.on {
  color: var(--label);
  background: var(--plate);
  box-shadow: inset 0 0 0 .5px var(--edge-ring);
}
.caption {
  position: fixed; left: 18px; bottom: 14px; z-index: 30;
  font-size: 11px; color: var(--label-2nd); letter-spacing: .01em;
}

/* ══════════ 场景与 200% 缩放检视 ══════════ */
.scene {
  position: relative; z-index: 10;
  min-height: 100vh; min-width: 100vw;
  display: flex; align-items: center; justify-content: center;
  padding: 120px 60px;
}
.zoom { transform-origin: center center; transition: transform .18s var(--ease-slide); }
.zoom.z2 { transform: scale(2); }

/* ══════════ 组合体:两个独立容器,不嵌套 ══════════ */
.compose { position: relative; animation: panelIn .12s var(--ease-pop) both; transition: margin-top .18s var(--ease-slide); }
/* 浮窗绝对定位不占位:展开时给组合体补上浮窗全高(216+16)的上边距,flex 居中后净下移一半,组合体视觉居中 */
.compose.with-pop { margin-top: 232px; }

/* ── 容器 A:图标长条 ── */
.strip {
  position: relative;
  border-radius: var(--r-panel);
  background: var(--glass-tint); background-image: var(--glass-sheen);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  box-shadow: var(--shadow-strip), 0 0 0 .5px var(--edge-ring), inset 0 .5px 0 var(--edge-hi);
  padding: 12px 14px;
  transition: background .2s ease, box-shadow .2s ease;
}
.cells { display: flex; gap: var(--cell-gap); }
.cell {
  width: var(--cell); height: var(--cell);
  display: flex; align-items: center; justify-content: center;
  position: relative; cursor: pointer;
}
.cell::before {                          /* 选中托底:极轻,不上场 */
  content: ''; position: absolute; inset: 0;
  border-radius: var(--r-cell);
  background: var(--plate);
  opacity: 0; transition: opacity .1s ease;
}
.cell:hover::before { opacity: .45; }    /* hover 只给一半深度,主权仍在选中态 */
.cell.sel::before { opacity: 1; }
.cell .icon {
  width: var(--icon); height: var(--icon);
  position: relative;
  filter: var(--icon-shadow);            /* drop-shadow 跟 alpha 走,浮空感来源 */
  transition: filter .1s ease, transform .1s ease;
}
.cell.sel .icon { transform: translateY(-1px); filter: var(--icon-shadow-sel); }

/* ── 容器 B:窗口预览浮窗(悬在长条上方,中心正对选中图标)── */
.popover {
  position: absolute; bottom: calc(100% + var(--pop-gap-y));
  border-radius: var(--r-panel);
  background: var(--glass-tint); background-image: var(--glass-sheen);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  box-shadow: var(--shadow-pop), 0 0 0 .5px var(--edge-ring), inset 0 .5px 0 var(--edge-hi);
  padding: var(--pop-pad);
  display: flex; gap: var(--card-gap);
  transition: left .18s var(--ease-slide), opacity .1s ease, background .2s ease, box-shadow .2s ease;
  animation: popIn .12s var(--ease-pop) both;
}
.popover.gone { opacity: 0; pointer-events: none; }

/* ── 窗口缩略卡:纯截图 + 红绿灯,无标题 ── */
.card {
  position: relative; height: var(--card-h);
  border-radius: var(--r-card); overflow: hidden;
  box-shadow: 0 0 0 .5px var(--card-ring), var(--card-shadow);
  cursor: pointer;
  transition: box-shadow .1s ease;
  /* 错落入场:每张卡晚 18ms,群像"铺开"而不是"砸下来" */
  animation: cardIn .16s var(--ease-pop) both;
  animation-delay: calc(var(--i, 0) * 18ms);
}
.card img { height: var(--card-h); display: block; }
.card:hover { box-shadow: 0 0 0 .5px var(--card-ring), 0 12px 28px rgba(0,0,0,.18), 0 3px 7px rgba(0,0,0,.12); }
.card.sel {
  box-shadow:
    0 0 0 2px var(--ko),                 /* knockout:把蓝环从截图上剥开 */
    0 0 0 4.5px var(--accent),           /* 系统聚焦环 */
    var(--card-shadow-sel);
}
/* 标题栏带:把窗口的"标题栏"还给截图,红绿灯住进带里,不再压内容 */
.tbar {
  position: relative;
  height: var(--tb-h);
  display: flex; align-items: center; padding-left: 10px;
  background: var(--tb-tint);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border-bottom: .5px solid var(--tb-line);
}
.lights { display: flex; gap: 8px; }
/* 窗口名:全带宽居中(真实标题栏的位次),轻字重低对比,超长省略 */
.tbar .title {
  position: absolute; left: 50%; transform: translateX(-50%);
  max-width: calc(100% - 96px);           /* 给红绿灯让出左区 */
  font-size: 11px; font-weight: 500; line-height: 1;
  color: var(--label-name);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  pointer-events: none;
}
.lights i {
  width: 10px; height: 10px; border-radius: 50%;
  box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12),
              inset 0 1px 1px rgba(255,255,255,.30),
              inset 0 -1px 1.5px rgba(0,0,0,.16);
}
.lights .r { background: var(--tl-r); } .lights .y { background: var(--tl-y); } .lights .g { background: var(--tl-g); }

/* ══════════ 动效定义(全部无回弹)══════════ */
@keyframes panelIn { from { opacity: 0; transform: scale(.96); } }
@keyframes popIn   { from { opacity: 0; transform: translateY(-5px); } }
@keyframes cardIn  { from { opacity: 0; transform: translateY(-6px) scale(.97); } }
.popover.swap { animation: none; }       /* 换组时浮窗本体不动,只让卡错落重排 */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<div class="wallpaper"></div>

<div class="controls">
  <div class="seg" id="segFrame">
    <button data-v="a">帧 A · 长条</button><button data-v="b" class="on">帧 B · 预览</button>
  </div>
  <div class="seg" id="segTheme">
    <button data-v="light" class="on">浅色</button><button data-v="dark">深色</button>
  </div>
  <div class="seg" id="segZoom">
    <button data-v="1" class="on">100%</button><button data-v="2">200%</button>
  </div>
</div>

<div class="scene">
  <div class="zoom" id="zoom">
    <div class="compose" id="compose">
      <div class="popover" id="popover"></div>
      <div class="strip" id="strip">
        <div class="cells" id="cells"></div>
      </div>
    </div>
  </div>
</div>

<div class="caption">点击图标移动选中 · ← → 在窗口间移动 · Tab / ⇧Tab 切换 App · 无窗 App 不弹预览</div>

<script>
/* __ASSETS__ */

const APPS = [
  { id:'finder',  name:'Finder',         icon:D['icon-finder'],  wins:[] },
  { id:'chrome',  name:'Google Chrome',  icon:D['icon-chrome'],  wins:[
    { src:D['w-chrome-1'], w:1280, h:800, t:'ejbills/DockDoor: Window peeking and alt-tab for macOS' },
    { src:D['w-chrome-2'], w:1280, h:889, t:'macOS' },
    { src:D['w-safari-1'], w:1280, h:917, t:"What's New - Apple Developer" },
  ]},
  { id:'idea',    name:'IntelliJ IDEA',  icon:D['icon-idea'],    wins:[{ src:D['w-idea-1'], w:720, h:391, t:'TrainXProductOrderServiceImpl.java' }] },
  { id:'ghostty', name:'Ghostty',        icon:D['icon-ghostty'], wins:[{ src:D['w-term-1'], w:720, h:474, t:'raft-election — zsh' }] },
  { id:'xcode',   name:'Xcode',          icon:D['icon-xcode'],   wins:[{ src:D['w-xcode-1'], w:720, h:447, t:'CursorScreenAnchor.swift' }] },
  { id:'obsidian',name:'Obsidian',       icon:D['icon-obsidian'],wins:[] },
  { id:'firefox', name:'Firefox',        icon:D['icon-firefox'], wins:[] },
];

const state = { app: 1, win: { chrome: 0, idea: 0, ghostty: 0, xcode: 0 }, preview: true, theme: 'light' };

const $ = id => document.getElementById(id);
const cellsEl = $('cells'), popEl = $('popover'), composeEl = $('compose');

/* ── 长条渲染(一次)── */
APPS.forEach((a, i) => {
  const c = document.createElement('div');
  c.className = 'cell' + (i === state.app ? ' sel' : '');
  c.innerHTML = `<img class="icon" src="${a.icon}" alt="${a.name}">`;
  c.addEventListener('click', () => selectApp(i));
  cellsEl.appendChild(c);
});

function selectApp(i, keepWin) {
  state.app = i;
  [...cellsEl.children].forEach((c, j) => c.classList.toggle('sel', j === i));
  renderPopover();
}

function renderPopover() {
  const a = APPS[state.app];
  const show = state.preview && a.wins.length > 0;
  popEl.classList.toggle('gone', !show);
  composeEl.classList.toggle('with-pop', show);
  if (!show) return;
  const sel = state.win[a.id] || 0;
  popEl.innerHTML = a.wins.map((w, j) => `
    <div class="card${j === sel ? ' sel' : ''}" data-j="${j}" style="--i:${j}">
      <div class="tbar"><div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="title">${w.t}</div></div>
      <img src="${w.src}" width="${Math.round(190 * w.w / w.h)}" height="190" alt="">
    </div>`).join('');
  [...popEl.children].forEach(c => c.addEventListener('click', () => selectWin(+c.dataset.j)));
  popEl.classList.remove('swap'); void popEl.offsetWidth; popEl.classList.add('swap');
  requestAnimationFrame(centerPopover);
}

function selectWin(j) {
  state.win[APPS[state.app].id] = j;
  [...popEl.children].forEach((c, k) => c.classList.toggle('sel', k === j));
}

/* 冻结语义:浮窗水平中心正对选中 App 图标,超界收进可视区 */
function centerPopover() {
  if (popEl.classList.contains('gone')) return;
  const cell = cellsEl.children[state.app].getBoundingClientRect();
  const comp = composeEl.getBoundingClientRect();
  const zoom = state.zoom2 ? 2 : 1;
  const cellCx = (cell.left + cell.width / 2 - comp.left) / zoom;
  const popW = popEl.offsetWidth;
  const maxLeft = window.innerWidth / zoom - popW - 24;
  popEl.style.left = Math.max(24, Math.min(cellCx - popW / 2, maxLeft)) + 'px';
}

/* ── 键盘(与冻结权责一致:Tab 在 App 间,←→ 只在窗间)── */
document.addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); selectApp((state.app + (e.shiftKey ? -1 : 1) + APPS.length) % APPS.length); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const a = APPS[state.app]; if (a.wins.length < 2) return;
    selectWin(((state.win[a.id] || 0) + (e.key === 'ArrowRight' ? 1 : -1) + a.wins.length) % a.wins.length);
  }
});

/* ── 演示控制条 ── */
function segWire(id, fn) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...$(id).children].forEach(x => x.classList.toggle('on', x === b));
    fn(b.dataset.v);
  });
}
segWire('segFrame', v => { state.preview = v === 'b'; renderPopover(); });
segWire('segTheme', v => { state.theme = v; document.documentElement.dataset.theme = v; });
segWire('segZoom', v => { state.zoom2 = v === '2'; $('zoom').classList.toggle('z2', state.zoom2); requestAnimationFrame(centerPopover); });
window.addEventListener('resize', centerPopover);

/* ── 初帧(支持 ?theme=dark&frame=a&zoom=2 便于无头验收截图)── */
const qp = new URLSearchParams(location.search);
function setSeg(id, v) { [...$(id).children].forEach(x => x.classList.toggle('on', x.dataset.v === v)); }
if (qp.get('theme') === 'dark') { state.theme = 'dark'; document.documentElement.dataset.theme = 'dark'; setSeg('segTheme', 'dark'); }
if (qp.get('frame') === 'a') { state.preview = false; setSeg('segFrame', 'a'); }
if (qp.get('zoom') === '2') { state.zoom2 = true; $('zoom').classList.add('z2'); setSeg('segZoom', '2'); }
renderPopover();
</script>
</body>
</html>
