<!DOCTYPE html><html><head><meta charset="utf-8"><style>
 html,body{margin:0;background:#F6F5F3;font:13px -apple-system,"PingFang SC",sans-serif}
 h1{font-size:15px;font-weight:600;margin:20px 24px 12px;color:#3A3A3C}
 .wrap{display:flex;gap:24px;padding:0 24px 24px}
 .lab{font-size:12px;color:#8A8A8E;margin:0 0 6px}
 .win{width:600px;height:480px;background:#ECEEF2;border-radius:10px;position:relative;overflow:hidden;
      box-shadow:0 2px 10px rgba(0,0,0,.08)}
 .lights{display:flex;gap:8px;padding:13px 0 0 14px}
 .lights i{width:12px;height:12px;border-radius:50%;display:block}
 .prism{position:absolute;top:38px;left:0;right:0;height:1px;background:linear-gradient(90deg,#FF6B6B 0%,#FFB648 16%,#FFE066 32%,#4ADE80 48%,#38BDF8 66%,#8B7CF6 84%,#FF6B6B 100%)}
 .tabs{display:flex;justify-content:center;gap:4px;margin-top:22px}
 .tabs span{font-size:12.5px;font-weight:500;color:#16171C;padding:7px 14px;border-radius:9px}
 .tabs .on{background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.06)}
 .content{padding:26px 28px 0}
</style></head><body>
<h1>设置窗排版:组标题该多"主标题"</h1>
<div class="wrap">
  <div><div class="lab">改前:组标题 11pt 灰 + 4pt 圆点 —— 比它管着的行标题还轻</div><div class="win">
  <div class="lights"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div>
  <div class="prism"></div>
  <div class="tabs"><span>通用</span><span>快捷键</span><span class="on">关于</span></div>
  <div class="content"><div style="margin-bottom:7px"><div style="font-size:11px;color:rgba(22,23,28,.56)"><i style="width:4px;height:4px;border-radius:50%;background:rgba(22,23,28,.56);display:inline-block;margin-right:6px;vertical-align:middle"></i>版本信息</div></div><div style="display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(22,23,28,.09);"><div><div style="color:#16171C;font-size:13px">名称</div></div><div style="color:rgba(22,23,28,.56);font-size:12.5px">Glance</div></div><div style="display:flex;align-items:center;justify-content:space-between;padding:13px 0;"><div><div style="color:#16171C;font-size:13px">版本</div></div><div style="color:rgba(22,23,28,.56);font-size:12.5px">0.1.0</div></div><div style="margin-top:20px;margin-bottom:7px"><div style="font-size:11px;color:rgba(22,23,28,.56)"><i style="width:4px;height:4px;border-radius:50%;background:rgba(22,23,28,.56);display:inline-block;margin-right:6px;vertical-align:middle"></i>权限</div></div><div style="display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(22,23,28,.09);"><div><div style="color:#16171C;font-size:13px">辅助功能</div><div style="color:rgba(22,23,28,.56);font-size:11.5px;line-height:1.55;margin-top:4px">用于读取与聚焦窗口。缺失时切换器无法工作。</div></div><div style="display:flex;align-items:center;gap:6px;color:rgba(22,23,28,.56);font-size:12.5px"><i style="width:8px;height:8px;border-radius:50%;background:#34C759;display:inline-block"></i>已授权</div></div><div style="display:flex;align-items:center;justify-content:space-between;padding:13px 0;"><div><div style="color:#16171C;font-size:13px">屏幕录制</div><div style="color:rgba(22,23,28,.56);font-size:11.5px;line-height:1.55;margin-top:4px">用于生成窗口预览。</div></div><div style="display:flex;align-items:center;gap:6px;color:rgba(22,23,28,.56);font-size:12.5px"><i style="width:8px;height:8px;border-radius:50%;background:#34C759;display:inline-block"></i>已授权</div></div></div>
</div></div>
  <div><div class="lab">改后:组标题 13pt 半粗 + 墨色 + 发丝边框胶囊;组间距与行距同步松开</div><div class="win">
  <div class="lights"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div>
  <div class="prism"></div>
  <div class="tabs"><span>通用</span><span>快捷键</span><span class="on">关于</span></div>
  <div class="content"><div style="margin-bottom:10px"><div style="display:inline-block;font-size:13px;font-weight:600;color:#16171C;padding:4px 9px;border:1px solid rgba(22,23,28,.15);border-radius:8px">版本信息</div></div><div style="display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(22,23,28,.09);"><div><div style="color:#16171C;font-size:13px">名称</div></div><div style="color:rgba(22,23,28,.56);font-size:13px">Glance</div></div><div style="display:flex;align-items:center;justify-content:space-between;padding:13px 0;"><div><div style="color:#16171C;font-size:13px">版本</div></div><div style="color:rgba(22,23,28,.56);font-size:13px">0.1.0</div></div><div style="margin-top:26px;margin-bottom:10px"><div style="display:inline-block;font-size:13px;font-weight:600;color:#16171C;padding:4px 9px;border:1px solid rgba(22,23,28,.15);border-radius:8px">权限</div></div><div style="display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(22,23,28,.09);"><div><div style="color:#16171C;font-size:13px">辅助功能</div><div style="color:rgba(22,23,28,.56);font-size:12px;line-height:1.55;margin-top:4px">用于读取与聚焦窗口。缺失时切换器无法工作。</div></div><div style="display:flex;align-items:center;gap:6px;color:rgba(22,23,28,.56);font-size:13px"><i style="width:8px;height:8px;border-radius:50%;background:#34C759;display:inline-block"></i>已授权</div></div><div style="display:flex;align-items:center;justify-content:space-between;padding:13px 0;"><div><div style="color:#16171C;font-size:13px">屏幕录制</div><div style="color:rgba(22,23,28,.56);font-size:12px;line-height:1.55;margin-top:4px">用于生成窗口预览。</div></div><div style="display:flex;align-items:center;gap:6px;color:rgba(22,23,28,.56);font-size:13px"><i style="width:8px;height:8px;border-radius:50%;background:#34C759;display:inline-block"></i>已授权</div></div></div>
</div></div>
</div>
</body></html>
